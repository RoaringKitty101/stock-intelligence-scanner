<style>
:root {
  --bg: #080d18;
  --bg2: #0d1322;
  --bg3: #111827;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #f0f4ff;
  --text2: rgba(255,255,255,0.6);
  --text3: rgba(255,255,255,0.3);
  --accent: #00e5a0;
  --accent2: #7c3aed;
  --danger: #ff4d6d;
  --warn: #f5a623;
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'Syne', sans-serif;
  --safe-top: env(safe-area-inset-top, 44px);
  --safe-bottom: env(safe-area-inset-bottom, 34px);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  height: 100%;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  max-width: 430px;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
}

/* ── Status Bar ── */
.status-bar {
  padding: calc(var(--safe-top) + 6px) 20px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  flex-shrink: 0;
  background: rgba(8,13,24,0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

/* ── Nav Header ── */
.nav-header {
  padding: 10px 16px 12px;
  background: rgba(8,13,24,0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}

.nav-header .back-btn {
  background: rgba(255,255,255,0.07);
  border: none;
  color: var(--accent);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  font-family: var(--sans);
  margin-bottom: 4px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.nav-title {
  font-size: 28px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -1px;
  line-height: 1;
}

.nav-title.small { font-size: 20px; letter-spacing: -0.5px; margin-top: 4px; }

.nav-sub {
  font-size: 11px;
  color: var(--text3);
  margin-top: 3px;
  font-family: var(--mono);
  letter-spacing: 0.5px;
}

/* ── Scrollable Content ── */
.screen {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding-bottom: calc(80px + var(--safe-bottom));
}

.screen::-webkit-scrollbar { display: none; }

/* ── Tab Bar ── */
.tab-bar {
  position: absolute;
  bottom: 0;
  left: 0; right: 0;
  background: rgba(8,13,24,0.96);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-top: 1px solid var(--border);
  display: flex;
  padding: 8px 0;
  padding-bottom: calc(8px + var(--safe-bottom));
  z-index: 100;
}

.tab-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 0;
  transition: all 0.2s;
}

.tab-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  transition: all 0.2s;
}

.tab-btn.active .tab-icon { background: rgba(0,229,160,0.15); }
.tab-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--text3);
  letter-spacing: 0.5px;
  font-family: var(--sans);
}
.tab-btn.active .tab-label { color: var(--accent); }

/* ── Cards & Components ── */
.card {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
}

.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  font-family: var(--mono);
  letter-spacing: 0.5px;
  white-space: nowrap;
}

.badge-buy  { background: rgba(0,229,160,0.12); color:#00e5a0; border:1px solid rgba(0,229,160,0.3); }
.badge-sell { background: rgba(255,77,109,0.12); color:#ff4d6d; border:1px solid rgba(255,77,109,0.3); }
.badge-hold { background: rgba(245,166,35,0.12); color:#f5a623; border:1px solid rgba(245,166,35,0.3); }

.section-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-family: var(--mono);
  padding: 0 16px;
  margin-bottom: 10px;
}

/* ── Score Bar ── */
.score-bar-wrap { margin-bottom: 8px; }
.score-bar-row { display:flex; justify-content:space-between; margin-bottom:4px; }
.score-bar-label { font-size:11px; color:var(--text3); font-family:var(--mono); text-transform:uppercase; letter-spacing:1px; }
.score-bar-val { font-size:11px; color:var(--text2); font-family:var(--mono); }
.score-bar-track { height:4px; background:rgba(255,255,255,0.08); border-radius:2px; overflow:hidden; }
.score-bar-fill { height:100%; border-radius:2px; transition: width 1s cubic-bezier(.4,0,.2,1); }

/* ── Score Ring ── */
.ring-wrap { position:relative; display:inline-block; }
.ring-inner {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}
.ring-num { font-family:var(--mono); font-weight:700; color:var(--text); }
.ring-lbl { font-size:9px; color:var(--text3); text-transform:uppercase; letter-spacing:1px; }

/* ── Animations ── */
@keyframes fadeUp {
  from { opacity:0; transform:translateY(12px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes shimmer {
  0%   { background-position: -200% center; }
  100% { background-position:  200% center; }
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

.fade-up { animation: fadeUp 0.4s ease both; }
.fade-up-1 { animation-delay: 0.05s; }
.fade-up-2 { animation-delay: 0.10s; }
.fade-up-3 { animation-delay: 0.15s; }
.fade-up-4 { animation-delay: 0.20s; }
.fade-up-5 { animation-delay: 0.25s; }

/* ── Install Banner ── */
.install-banner {
  margin: 12px 16px;
  padding: 14px 16px;
  background: linear-gradient(135deg, rgba(0,229,160,0.1), rgba(124,58,237,0.08));
  border: 1px solid rgba(0,229,160,0.25);
  border-radius: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.install-banner-icon { font-size: 24px; flex-shrink: 0; }
.install-banner-text .title { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
.install-banner-text .sub { font-size: 11px; color: var(--text3); line-height: 1.5; }
.install-banner-close { margin-left:auto; background:none; border:none; color:var(--text3); font-size:18px; cursor:pointer; flex-shrink:0; padding:4px; }

/* ── News ── */
.news-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px 16px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: background 0.15s;
  display: block;
  text-decoration: none;
}
.news-card:active { background: rgba(255,255,255,0.06); }
.news-sentiment-dot {
  width: 8px; height: 8px; border-radius: 50%;
  display: inline-block; flex-shrink: 0; margin-top: 3px;
}
.news-category {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 700;
  font-family: var(--mono);
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.news-shimmer {
  background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes ticker {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
.ticker-wrap {
  overflow: hidden;
  border-bottom: 1px solid var(--border);
  padding: 8px 0;
  margin-bottom: 4px;
}
.ticker-inner {
  display: flex;
  gap: 40px;
  white-space: nowrap;
  animation: ticker 30s linear infinite;
  width: max-content;
}
.ticker-item {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ── Toggle Switch ── */
.toggle {
  width: 48px; height: 28px; border-radius: 14px;
  position: relative; cursor: pointer;
  transition: background 0.3s; flex-shrink: 0;
}
.toggle-knob {
  position: absolute; top: 3px;
  width: 22px; height: 22px; border-radius: 50%;
  background: #fff; transition: left 0.3s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}

/* ── Inputs ── */
input[type=range] { width:100%; accent-color: var(--accent); }
</style>
</head>

// ═══════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════
const sc = (s) => s === 'BUY' ? '#00e5a0' : s === 'SELL' ? '#ff4d6d' : '#f5a623';
const sbg = (s) => s === 'BUY' ? 'rgba(0,229,160,0.12)' : s === 'SELL' ? 'rgba(255,77,109,0.12)' : 'rgba(245,166,35,0.12)';
const sborder = (s) => s === 'BUY' ? 'rgba(0,229,160,0.3)' : s === 'SELL' ? 'rgba(255,77,109,0.3)' : 'rgba(245,166,35,0.3)';
const scoreColor = (n) => n >= 65 ? '#00e5a0' : n <= 40 ? '#ff4d6d' : '#f5a623';
const fmt = (v, suf='') => v !== null && v !== undefined ? `${v}${suf}` : 'N/A';
const badge = (signal, score='') => `<span class="badge badge-${signal.toLowerCase()}">${signal}${score ? ' '+score : ''}</span>`;

function scoreBar(score, label) {
  const color = scoreColor(score);
  return `<div class="score-bar-wrap">
    <div class="score-bar-row">
      <span class="score-bar-label">${label}</span>
      <span class="score-bar-val">${score}</span>
    </div>
    <div class="score-bar-track">
      <div class="score-bar-fill" style="width:${score}%;background:${color}"></div>
    </div>
  </div>`;
}

function scoreRing(score, size=64, stroke=5) {
  const r = (size - stroke*2) / 2;
  const circ = 2 * Math.PI * r;
  const offset = circ - (score/100)*circ;
  const color = scoreColor(score);
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round"
      style="transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)"/>
  </svg>`;
}

function sparkline(positive, w=56, h=26) {
  const pts = positive ? [14,20,16,10,8,12,6,4,8,2] : [2,6,4,10,8,14,12,18,16,22];
  const max=Math.max(...pts), min=Math.min(...pts);
  const norm = pts.map(p => h - ((p-min)/(max-min+0.001))*(h-4) - 2);
  const d = norm.map((y,i) => `${i===0?'M':'L'} ${(i/(pts.length-1))*w} ${y}`).join(' ');
  const color = positive ? '#00e5a0' : '#ff4d6d';
  return `<svg width="${w}" height="${h}" style="overflow:visible"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

// ═══════════════════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════════════════
function switchTab(tab, btn) {
  currentTab = tab;
  currentStock = null;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('backBtnWrap').style.display = 'none';
  document.getElementById('tabBar').style.display = 'flex';
  renderScreen();
}

function openStock(ticker) {
  currentStock = STOCKS.find(s => s.ticker === ticker);
  document.getElementById('backBtnWrap').style.display = 'block';
  document.getElementById('tabBar').style.display = 'none';
  renderScreen();
}

function goBack() {
  currentStock = null;
  document.getElementById('backBtnWrap').style.display = 'none';
  document.getElementById('tabBar').style.display = 'flex';
  renderScreen();
}

function toggleWatch(ticker) {
  if (watchlist.includes(ticker)) {
    watchlist = watchlist.filter(t => t !== ticker);
  } else {
    watchlist.push(ticker);
  }
  renderScreen();
}

      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px" class="fade-up fade-up-1">

async function fetchNews() {
  if (newsLoading) return;
  newsLoading = true;
  newsData = [];
  renderScreen();

  // Try fetching real headlines from multiple RSS sources via CORS proxy
  const RSS_FEEDS = [
    'https://feeds.finance.yahoo.com/rss/2.0/headline?s=^GSPC&region=US&lang=en-US',
    'https://feeds.reuters.com/reuters/businessNews',
    'https://www.cnbc.com/id/100003114/device/rss/rss.html',
  ];

  let fetched = false;

  for (const feed of RSS_FEEDS) {
    try {
      const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(feed)}`;
      const res = await fetch(proxyUrl, {signal: AbortSignal.timeout(5000)});
      if (!res.ok) continue;
      const data = await res.json();
      if (!data.contents) continue;

      const parser = new DOMParser();
      const xml = parser.parseFromString(data.contents, 'text/xml');
      const items = xml.querySelectorAll('item');

      items.forEach((item, i) => {
        if (i >= 5) return;
        const title = item.querySelector('title')?.textContent?.trim() || '';
        const link = item.querySelector('link')?.textContent?.trim() || '#';
        const pubDate = item.querySelector('pubDate')?.textContent || '';
        const source = new URL(feed).hostname.replace('www.','').replace('feeds.','').split('.')[0].toUpperCase();

        if (!title || title.length < 10) return;

        // Simple client-side sentiment scoring
        const bullishWords = ['gains','surges','beats','rises','rally','growth','strong','record','up','higher','profit','win','bullish','upgrade','buy'];
        const bearishWords = ['falls','drops','misses','slides','decline','loss','weak','cut','down','lower','disappoints','sell','bearish','downgrade','risk'];
        const titleLower = title.toLowerCase();
        let score = 0;
        bullishWords.forEach(w => { if(titleLower.includes(w)) score += 0.2; });
        bearishWords.forEach(w => { if(titleLower.includes(w)) score -= 0.2; });
        score = Math.max(-1, Math.min(1, score));
        const sentiment = score > 0.1 ? 'BULLISH' : score < -0.1 ? 'BEARISH' : 'NEUTRAL';

        const timeAgo = pubDate ? getTimeAgo(new Date(pubDate)) : 'Just now';

        newsData.push({
          title, source, time: timeAgo, url: link,
          sentiment, sentimentScore: score,
          category: 'Market', tickers: [], impact: 'MEDIUM'
        });
      });

      if (newsData.length >= 5) { fetched = true; break; }
    } catch(e) { continue; }
  }

  // Fall back to curated static news if fetch failed
  if (!fetched || newsData.length < 5) {
    newsData = [...STATIC_NEWS];
  }

  // Always top up to 10 with static if needed
  if (newsData.length < 10) {
    const existing = new Set(newsData.map(n => n.title));
    STATIC_NEWS.forEach(n => {
      if (!existing.has(n.title) && newsData.length < 10) newsData.push(n);
    });
  }

  newsData = newsData.slice(0, 10);
  newsLoading = false;
  newsLastFetched = new Date();
  renderScreen();
}

function getTimeAgo(date) {
  const diff = (Date.now() - date.getTime()) / 1000;
  if (diff < 60) return 'Just now';
  if (diff < 3600) return `${Math.round(diff/60)} min ago`;
  if (diff < 86400) return `${Math.round(diff/3600)} hr ago`;
  return `${Math.round(diff/86400)}d ago`;
}

      Updated ${getTimeAgo(newsLastFetched)} · ${newsData.length} headlines
    </div>` : '';

  const newsCards = displayed.map((n, i) => {
    const sentColor = n.sentiment==='BULLISH'?'#00e5a0':n.sentiment==='BEARISH'?'#ff4d6d':'#f5a623';
    const sentBg = n.sentiment==='BULLISH'?'rgba(0,229,160,0.08)':n.sentiment==='BEARISH'?'rgba(255,77,109,0.08)':'rgba(245,166,35,0.08)';
    const catColor = catColors[n.category] || catColors['Default'];
    const catText = catTextColors[n.category] || catTextColors['Default'];
    const impactColor = n.impact==='HIGH'?'#ff4d6d':n.impact==='MEDIUM'?'#f5a623':'#6b7aaa';
    const barWidth = Math.abs(n.sentimentScore || 0) * 100;

    return `
    <a href="${n.url}" target="_blank" rel="noopener" class="news-card fade-up" style="animation-delay:${i*0.04}s;display:block;text-decoration:none">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <span class="news-category" style="background:${catColor};color:${catText}">${n.category}</span>
          ${n.impact==='HIGH'?`<span class="news-category" style="background:rgba(255,77,109,0.1);color:#ff4d6d">HIGH IMPACT</span>`:''}
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
          <div class="news-sentiment-dot" style="background:${sentColor}"></div>
          <span style="font-size:10px;font-weight:700;color:${sentColor};font-family:var(--mono)">${n.sentiment}</span>
        </div>
      </div>

      <div style="font-size:14px;font-weight:600;color:var(--text);line-height:1.45;margin-bottom:10px">${n.title}</div>

      ${n.tickers && n.tickers.length > 0 ? `
      <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
        ${n.tickers.map(t=>`<span onclick="event.preventDefault();event.stopPropagation();openStock('${t}')" style="background:rgba(0,229,160,0.08);border:1px solid rgba(0,229,160,0.15);color:#00e5a0;border-radius:6px;padding:2px 8px;font-size:11px;font-family:var(--mono);cursor:pointer">${t}</span>`).join('')}
      </div>` : ''}

      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:11px;font-weight:700;color:var(--text2)">${n.source}</span>
          <span style="font-size:11px;color:var(--text3)">·</span>
          <span style="font-size:11px;color:var(--text3)">${n.time}</span>
        </div>
        <span style="font-size:11px;color:var(--text3)">Read →</span>
      </div>

      <div style="margin-top:8px">
        <div style="height:3px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden">
          <div style="height:100%;width:${barWidth}%;background:${sentColor};border-radius:2px;transition:width 0.8s"></div>
        </div>
      </div>
    </a>`;
  }).join('');

  return `
    ${tickerHtml}
    ${statsHtml}
    ${lastFetchedHtml}
    ${filterHtml}
    <div style="padding:0 16px">
      ${displayed.length === 0 ? `<div style="text-align:center;color:var(--text3);padding:40px 0;font-size:14px">No ${newsFilter.toLowerCase()} headlines</div>` : newsCards}
    </div>`;
}

// ═══════════════════════════════════════════════════════
//  RENDER ENGINE
// ═══════════════════════════════════════════════════════
function renderScreen() {
  const content = document.getElementById('screenContent');
  const scrollPos = content.scrollTop;

  if (currentStock) {
    window._dtab = window._dtab || 'overview';
    content.innerHTML = renderDetail();
  } else if (currentTab === 'home')     content.innerHTML = renderHome();
  else if (currentTab === 'scan')       content.innerHTML = renderScanner();
  else if (currentTab === 'alerts')     content.innerHTML = renderAlerts();
  else if (currentTab === 'news')       content.innerHTML = renderNews();
  else if (currentTab === 'settings')   content.innerHTML = renderSettings();

  if (!currentStock) content.scrollTop = scrollPos;
}

// ═══════════════════════════════════════════════════════
//  CLOCK
// ═══════════════════════════════════════════════════════
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}
setInterval(updateClock, 1000);
updateClock();

// ═══════════════════════════════════════════════════════
//  SERVICE WORKER REGISTRATION
// ═══════════════════════════════════════════════════════
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(() => console.log('SW registered'))
      .catch(err => console.log('SW failed:', err));
  });
}

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
renderScreen();
</script>
</body>
</html>
