<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="115" fill="#080d18"/>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1b3e"/>
      <stop offset="100%" stop-color="#080d18"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5a0"/>
      <stop offset="100%" stop-color="#00b87a"/>
    </linearGradient>
  </defs>
  <!-- Chart bars -->
  <rect x="96" y="320" width="52" height="120" rx="8" fill="#00e5a0" opacity="0.3"/>
  <rect x="166" y="260" width="52" height="180" rx="8" fill="#00e5a0" opacity="0.5"/>
  <rect x="236" y="200" width="52" height="240" rx="8" fill="#00e5a0" opacity="0.7"/>
  <rect x="306" y="150" width="52" height="290" rx="8" fill="url(#g1)"/>
  <rect x="376" y="100" width="52" height="340" rx="8" fill="url(#g1)" opacity="0.85"/>
  <!-- Trend line -->
  <polyline points="122,300 192,240 262,180 332,130 402,80" fill="none" stroke="#00e5a0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dot at top -->
  <circle cx="402" cy="80" r="14" fill="#00e5a0"/>
  <!-- Signal text -->
  <text x="256" y="490" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-size="28" font-family="monospace" font-weight="600" letter-spacing="4">INTEL</text>
